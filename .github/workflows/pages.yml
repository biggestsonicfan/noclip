# The explorer is a static site — the ROM decoding, polygon decoding and
# rendering all happen in the browser — so publishing it is just a copy. There
# is no build: no bundler, no dependency install, no generated file. What is
# served is what is in the tree.
#
# Only the four site paths are staged. That is the same rule the container's
# bind mounts carried, and it is what keeps a ROM out of the deploy: the zips
# are gitignored, so they are not in the checkout this workflow runs against,
# and even if one were, it is not in the list below. The dev server in stf-tools
# refuses a .zip per request because a local checkout genuinely has them sitting
# beside it; here the guarantee is structural instead — the artifact cannot
# serve a file it does not contain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # So the site can be republished without a commit — after changing the custom
  # domain, say, or to redeploy a run that failed on GitHub's side.
  workflow_dispatch:

# The three the deploy needs and nothing else: read the checkout, write to
# Pages, and mint the OIDC token deploy-pages authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Not cancel-in-progress: a run that is already uploading
# should finish rather than leave the site half-published, and the next push
# will overwrite it in a moment anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # CNAME goes in the artifact, not just the repo: Pages reads it from the
      # published site to know the custom domain.
      # The commit goes into the page so a bug report can name the build it
      # came from. The explorer runs entirely in the reader's browser against
      # the reader's own ROM set, so without this there is no way to tell which
      # version of the site a report is about. Staged, not committed: a working
      # checkout keeps saying "dev".
      #
      # The same stamp goes on every URL the page loads from this site, as a
      # query: the stylesheet, the entry module and each relative import inside
      # the modules. The CDN in front of Pages hands the scripts out with four
      # hours of browser cache, the page itself with ten minutes, so without
      # this a fresh page can run on yesterday's modules until a hard reload.
      # With it a new build is a new set of URLs the browser has never seen.
      # Pages ignores the query, so the files themselves stay where they are.
      - name: Stage the site
        run: |
          v=${GITHUB_SHA::7}
          mkdir _site
          cp index.html style.css CNAME _site/
          cp -r js _site/js
          sed -i "s|<meta name=\"build\" content=\"dev\">|<meta name=\"build\" content=\"$v\">|" _site/index.html
          sed -i -e "s|href=\"\./style\.css\"|href=\"./style.css?v=$v\"|" \
                 -e "s|src=\"\./js/app\.js\"|src=\"./js/app.js?v=$v\"|" _site/index.html
          sed -i -E "s#(from '\./[A-Za-z0-9_]+\.js)'#\1?v=$v'#" _site/js/*.js
          grep -o '<meta name="build"[^>]*>' _site/index.html
          grep -o "style\.css?v=$v\|app\.js?v=$v" _site/index.html
          # Every relative import was stamped: none is left bare.
          ! grep -n "from '\./[A-Za-z0-9_]*\.js'" _site/js/*.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
